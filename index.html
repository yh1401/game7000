<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="中了7000万 · 人生模拟器 —— 一款「中奖后人生」模拟游戏。10 年 120 个月，152 个事件，14 种结局，含 9 种黑暗结局。">
<meta name="theme-color" content="#0d0d18">
<title>中了7000万 · 人生模拟器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="timeline"><i id="tl-bar" style="width:0%"></i></div>

<!-- 音频控制栏（音效 / 背景音乐） -->
<div class="audio-ctl" id="audioCtl">
  <button id="btnSfx" class="audio-btn" title="音效开关（快捷键 S）" aria-label="音效开关">🔊</button>
  <button id="btnBgm" class="audio-btn" title="背景音乐开关（快捷键 M）" aria-label="背景音乐开关">🎵</button>
  <button id="btnTts" class="audio-btn" title="语音朗读开关（快捷键 R）" aria-label="语音朗读开关">🗣️</button>
</div>

<div class="wrap" id="app"></div>

<!-- 脚本按依赖顺序加载：音频 → 语音 → 核心 → 事件库 → 游戏流程 -->
<script src="js/audio.js"></script>
<script src="js/speech.js"></script>
<script src="js/core.js"></script>
<script src="js/events.js"></script>
<script src="js/game.js"></script>
</body>
</html>
